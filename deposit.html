   <header>
        <h1 class="text-center mt-5 text-primary">Realizar depósito <i class="bi bi-bank"></i></h1>
    </header>

     <main class="container py-4">
         <section>
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-4">
                    <p class="fs-3 fw-bold">Balance de la cuenta: $ <span id="montoBalance">0</span></p>
                    <form id="formDeposit">
                        <div class="mb-3">
                            <label for="monto" class="form-label">Monto a depositar: </label>
                            <input type="number" class="form-control" name="monto" id="monto" min="500"
                                placeholder="Introduce el monto a depositar..." required>
                            <div class="form-text">
                                Monto mínimo a depositar es de: $500.-
                            </div>
                        </div>
                        <div>
                            <input type="submit" value="Realizar deposito" class="btn btn-primary">
                        </div>
                    </form>
                    <div id="depositMessage" class="alert alert-info mt-3" role="alert" style="display:none;"></div>
                    <!-- Contenedor para alertas dinámicas (Bootstrap) -->
                    <div id="alert-container" class="mt-2"></div>
                </div>
            </div>
        </section>
        
    </main>
